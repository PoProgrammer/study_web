<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاور هوشمند | اوج‌گام</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js"></script>
    <style>
        .chat-container { display: flex; flex-direction: column; height: calc(100vh - 150px); }
        .chat-box { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 15px; font-size: 14px; line-height: 1.6; }
        .msg.user { align-self: flex-end; background: var(--color-blue); color: white; border-bottom-right-radius: 2px; }
        .msg.ai { align-self: flex-start; background: var(--bg-card); color: var(--text-main); border-bottom-left-radius: 2px; border: 1px solid var(--border-color); }
        .input-area { display: flex; gap: 10px; padding: 10px 0; }
        .input-area input { flex: 1; margin-bottom: 0; }
        .input-area button { width: 60px; padding: 0; }
        .loading { text-align: center; color: var(--text-muted); font-size: 13px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <button class="back-btn" onclick="window.location.href='/?user=' + userId">⬅️ بازگشت</button>
            <button class="danger-btn" onclick="clearChat()" style="width: auto; padding: 8px 15px; font-size: 13px;">🗑️ حذف تاریخچه</button>
        </div>
        <h1>🤖 مشاور هوشمند</h1>
        
        <div class="chat-container">
            <div class="chat-box" id="chatBox">
                <!-- پیام‌ها اینجا لود می‌شن -->
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="سوالت رو بپرس..." onkeypress="handleKeyPress(event)">
                <button class="primary-btn" onclick="sendMessage()">➡️</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user');
        if (!userId) window.location.href = '/';

        const chatBox = document.getElementById('chatBox');

        async function loadHistory() {
            chatBox.innerHTML = '<div class="loading">در حال بارگذاری تاریخچه...</div>';
            try {
                const res = await fetch(`/api/ai/chat-history/${userId}`);
                const data = await res.json();
                
                chatBox.innerHTML = '';
                if (data.messages.length === 0) {
                    chatBox.innerHTML = '<div class="loading">هنوز پیامی نداری. اولین سوالت رو بپرس!</div>';
                    return;
                }

                data.messages.forEach(msg => {
                    addMessageToUI(msg.role === 'user' ? 'user' : 'ai', msg.text);
                });
                scrollToBottom();
            } catch (e) {
                chatBox.innerHTML = '<div class="loading" style="color:red;">خطا در بارگذاری</div>';
            }
        }

        function addMessageToUI(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${sender}`;
            msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            chatBox.appendChild(msgDiv);
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            addMessageToUI('user', text);
            scrollToBottom();

            const formData = new FormData();
            formData.append('role', 'user');
            formData.append('text', text);
            fetch(`/api/ai/chat-history/${userId}`, { method: 'POST', body: formData });

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            loadingDiv.textContent = '🤖 در حال فکر کردن...';
            chatBox.appendChild(loadingDiv);
            scrollToBottom();

            try {
                const res = await fetch(`/api/advisor/${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: text })
                });

                loadingDiv.remove();

                if (res.ok) {
                    const data = await res.json();
                    addMessageToUI('ai', data.answer);
                    scrollToBottom();

                    const formDataAi = new FormData();
                    formDataAi.append('role', 'ai');
                    formDataAi.append('text', data.answer);
                    fetch(`/api/ai/chat-history/${userId}`, { method: 'POST', body: formDataAi });
                } else {
                    addMessageToUI('ai', '❌ خطا در ارتباط با هوش مصنوعی.');
                }
            } catch (e) {
                loadingDiv.remove();
                addMessageToUI('ai', '❌ خطای شبکه.');
            }
        }

        async function clearChat() {
            if (!confirm("مطمئنی می‌خوای کل تاریخچه چت رو پاک کنی؟")) return;
            try {
                await fetch(`/api/ai/chat-history/${userId}`, { method: 'DELETE' });
                loadHistory();
            } catch (e) {
                showToast("خطا در حذف تاریخچه", "error");
            }
        }

        loadHistory();
    </script>
</body>
</html>
