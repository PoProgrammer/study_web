<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پشتیبانی ادمین | اوج‌گام</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js"></script>
    <style>
        .back-btn { background: transparent; border: none; color: var(--text-muted); font-family: inherit; font-size: 16px; cursor: pointer; margin-bottom: 20px; padding: 10px; }
        .user-item { background: var(--bg-card); padding: 15px; border-radius: 10px; margin-bottom: 10px; cursor: pointer; border: 1px solid var(--border-color); display: flex; justify-content: space-between; }
        .user-item:hover { background: var(--bg-card-hover); }
        .unread-badge { background: #ef4444; color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .chat-container { display: flex; flex-direction: column; height: calc(100vh - 150px); }
        .chat-box { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 15px; font-size: 14px; line-height: 1.6; }
        .msg.user { align-self: flex-start; background: var(--color-blue); color: white; border-bottom-left-radius: 2px; }
        .msg.admin { align-self: flex-end; background: var(--color-green); color: white; border-bottom-right-radius: 2px; }
        .input-area { display: flex; gap: 10px; padding: 10px 0; }
        .input-area input { flex: 1; margin-bottom: 0; }
        .input-area button { width: 60px; padding: 0; }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="window.location.href='/?user=' + adminId">⬅️ بازگشت</button>
        <h1>👑 پشتیبانی ادمین</h1>
        <div id="content">در حال بارگذاری...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const adminId = urlParams.get('admin');
        const targetUserId = urlParams.get('user_id');
        if (!adminId) window.location.href = '/';

        if (targetUserId) {
            showChat(targetUserId);
        } else {
            showUserList();
        }

        async function showUserList() {
            document.getElementById('content').innerHTML = `<div style="text-align:center;">⏳ در حال بارگذاری...</div>`;
            try {
                const res = await fetch(`/api/admin/support/users?admin_id=${adminId}`);
                const data = await res.json();
                
                if (data.users.length === 0) {
                    document.getElementById('content').innerHTML = `<div class="box" style="text-align:center;">هنوز هیچ پیامی از کاربران نرسیده!</div>`;
                    return;
                }

                let html = '<div class="box"><h3>لیست کاربران</h3>';
                data.users.forEach(u => {
                    html += `
                        <div class="user-item" onclick="showChat(${u.user_id})">
                            <span>${u.name}</span>
                            ${u.unread > 0 ? `<span class="unread-badge">${u.unread} جدید</span>` : ''}
                        </div>
                    `;
                });
                html += '</div>';
                document.getElementById('content').innerHTML = html;
            } catch (e) {
                document.getElementById('content').innerHTML = `<div class="box" style="color:red;">خطا در بارگذاری</div>`;
            }
        }

        async function showChat(userId) {
            document.getElementById('content').innerHTML = `
                <div class="box" style="display:flex; justify-content:space-between; align-items:center;">
                    <b>چت با کاربر</b>
                    <button class="secondary-btn" style="width:auto; margin:0; padding:5px 10px;" onclick="window.location.href='admin_support.html?admin=${adminId}'">🔙 لیست</button>
                </div>
                <div class="chat-container">
                    <div class="chat-box" id="chatBox">⏳ در حال بارگذاری...</div>
                    <div class="input-area">
                        <input type="text" id="adminInput" placeholder="پاسخ..." onkeypress="handleKeyPress(event, ${userId})">
                        <button class="primary-btn" onclick="sendReply(${userId})">➡️</button>
                    </div>
                </div>
            `;
            loadMessages(userId);
        }

        async function loadMessages(userId) {
            const chatBox = document.getElementById('chatBox');
            try {
                const res = await fetch(`/api/admin/support/thread/${userId}?admin_id=${adminId}`);
                const data = await res.json();
                chatBox.innerHTML = '';
                data.messages.forEach(m => {
                    const div = document.createElement('div');
                    div.className = `msg ${m.sender}`;
                    div.innerHTML = m.text.replace(/\n/g, '<br>');
                    chatBox.appendChild(div);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (e) {
                chatBox.innerHTML = 'خطا در بارگذاری';
            }
        }

        function handleKeyPress(e, userId) {
            if (e.key === 'Enter') sendReply(userId);
        }

        async function sendReply(userId) {
            const input = document.getElementById('adminInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            try {
                await fetch(`/api/admin/support/reply/${userId}?admin_id=${adminId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                loadMessages(userId);
            } catch (e) {
                showToast("خطا در ارسال", "error");
            }
        }
    </script>
</body>
</html>
