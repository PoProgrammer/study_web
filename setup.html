<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تکمیل پروفایل | اوج‌گام</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js"></script>
    <style>
        .brand-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .brand-logo svg {
            width: 45px;
            height: 45px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        .brand-logo h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(90deg, var(--color-blue), var(--color-teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-section">
            
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3L1 9L5 11.18V17.18L12 21L19 17.18V11.18L21 10.09V17H23V9L12 3ZM18.82 9L12 12.72L5.18 9L12 5.28L18.82 9ZM17 16L12 18.72L7 16V12.27L12 15L17 12.27V16Z" fill="url(#grad1)"/>
                    <defs>
                        <linearGradient id="grad1" x1="1" y1="12" x2="23" y2="12" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#0ea5e9"/>
                            <stop offset="1" stop-color="#14b8a6"/>
                        </linearGradient>
                    </defs>
                </svg>
                <h1>تکمیل پروفایل</h1>
            </div>
            
            <p style="margin-bottom: 25px;">برای شخصی‌سازی تجربه‌ت، لطفاً پایه و رشته‌ت رو انتخاب کن.</p>
            
            <select id="grade" style="margin-bottom: 15px;">
                <option value="">انتخاب پایه...</option>
                <option value="دهم">دهم</option>
                <option value="یازدهم">یازدهم</option>
                <option value="دوازدهم">دوازدهم</option>
            </select>
            
            <select id="field" style="margin-bottom: 25px;">
                <option value="">انتخاب رشته...</option>
                <option value="ریاضی">ریاضی</option>
                <option value="تجربی">تجربی</option>
                <option value="انسانی">انسانی</option>
            </select>
            
            <button class="primary-btn" onclick="saveSetup()">ذخیره و ادامه</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user');
        
        if (!userId) window.location.href = '/';

        async function saveSetup() {
            const grade = document.getElementById('grade').value;
            const field = document.getElementById('field').value;

            if (!grade || !field) {
                return showToast("لطفاً پایه و رشته رو انتخاب کن", "warning");
            }

            try {
                const res = await fetch(`/api/user/setup/${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ grade, field })
                });

                if (res.ok) {
                    showToast("✅ پروفایل با موفقیت تکمیل شد!", "success");
                    localStorage.removeItem('ojGam_user');
                    window.location.href = `/?user=${userId}`;
                } else {
                    const data = await res.json();
                    showToast("❌ خطا: " + (data.detail || "مشکلی پیش اومد"), "error");
                }
            } catch (e) {
                showToast("❌ خطا در ارتباط با سرور", "error");
            }
        }
    </script>
</body>
</html>
