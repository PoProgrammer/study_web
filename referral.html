<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوت دوستان | اوج‌گام</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js"></script>
    <style>
        .code-box { background: var(--bg-card); padding: 15px; border-radius: 10px; text-align: center; font-size: 20px; font-family: monospace; border: 2px dashed var(--color-blue); margin: 15px 0; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; color: var(--text-main); }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="window.location.href='/?user=' + userId">⬅️ بازگشت</button>
        <h1>🎁 دعوت دوستان</h1>
        <div id="content">در حال بارگذاری...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user');
        if (!userId) window.location.href = '/';

        async function load() {
            const res = await fetch(`/api/referral/${userId}`);
            const data = await res.json();
            const container = document.getElementById('content');

            if (!data.has_purchased) {
                container.innerHTML = `
                    <div class="box" style="text-align:center;">
                        <p>⚠️ برای دعوت دوستان، اول باید <b>خودت اشتراک</b> خریده باشی.</p>
                        <p style="color:var(--text-muted); margin-top:10px;">بعد از خرید اول، کد اختصاصی دعوتت ساخته می‌شه.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="box" style="text-align:center;">
                    <h3>📝 کد اختصاصی تو:</h3>
                    <div class="code-box">${data.referral_code}</div>
                    <button class="primary-btn" onclick="copyCode('${data.referral_code}')">📋 کپی کد</button>
                </div>
                <div class="box">
                    <h3>📊 آمار دعوت‌ها</h3>
                    <div class="stat-row"><span>👥 دعوت‌شده‌ها:</span><b>${data.total_invited}</b></div>
                    <div class="stat-row"><span>✅ خرید کرده:</span><b>${data.successful}</b></div>
                    <div class="stat-row"><span>🎁 تخفیف موجود:</span><b>${data.discount}٪</b></div>
                </div>
                <div class="box">
                    <h3>💡 چطور کار می‌کنه؟</h3>
                    <p style="color:var(--text-main); line-height:2;">• کد رو به دوستت بده<br>• دوستت با کد ثبت‌نام کنه<br>• دوستت اشتراک بخره<br>• <b>۱۰٪ تخفیف</b> برای خرید بعدی خودت</p>
                </div>
            `;
        }

        function copyCode(code) {
            navigator.clipboard.writeText(code).then(() => {
                showToast("✅ کد کپی شد!", "success");
            }).catch(() => {
                showToast("کد: " + code, "info");
            });
        }

        load();
    </script>
</body>
</html>
