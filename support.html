<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پشتیبانی | اوج‌گام</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js"></script>
    <style>
        .chat-container { display: flex; flex-direction: column; height: calc(100vh - 150px); }
        .chat-box { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 15px; font-size: 14px; line-height: 1.6; }
        .msg.user { align-self: flex-end; background: var(--color-blue); color: white; border-bottom-right-radius: 2px; }
        .msg.admin { align-self: flex-start; background: var(--color-green); color: white; border-bottom-left-radius: 2px; }
        .input-area { display: flex; gap: 10px; padding: 10px 0; }
        .input-area input { flex: 1; margin-bottom: 0; }
        .input-area button { width: 60px; padding: 0; }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="window.location.href='/?user=' + userId">⬅️ بازگشت</button>
        <h1>📞 پشتیبانی</h1>
        
        <div class="chat-container">
            <div class="chat-box" id="chatBox">
                <div style="text-align:center; color:var(--text-muted); padding:20px;">در حال بارگذاری...</div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="پیامت رو بنویس..." onkeypress="handleKeyPress(event)">
                <button class="primary-btn" onclick="sendMessage()">➡️</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user');
        if (!userId) window.location.href = '/';

        const chatBox = document.getElementById('chatBox');

        async function loadMessages() {
            try {
                const res = await fetch(`/api/support/${userId}`);
                const data = await res.json();
                chatBox.innerHTML = '';
                if (data.messages.length === 0) {
                    chatBox.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:20px;">هنوز پیامی نداری. اولین پیامت رو بفرست!</div>';
                    return;
                }
                data.messages.forEach(m => {
                    const div = document.createElement('div');
                    div.className = `msg ${m.sender}`;
                    div.innerHTML = m.text.replace(/\n/g, '<br>');
                    chatBox.appendChild(div);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (e) {
                chatBox.innerHTML = '<div style="color:red; text-align:center;">خطا در بارگذاری</div>';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            const div = document.createElement('div');
            div.className = 'msg user';
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                await fetch(`/api/support/${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
            } catch (e) {
                showToast("خطا در ارسال پیام", "error");
            }
        }

        loadMessages();
        setInterval(loadMessages, 5000);
    </script>
</body>
</html>
